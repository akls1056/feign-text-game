<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Feign - Tam Sürüm</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        h1 { font-size: 1.5rem; text-align: center; color: #38bdf8; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        #log { height: 220px; overflow-y: scroll; background: #090d16; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 10px; line-height: 1.4; }
        select, button, input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; font-size: 1rem; box-sizing: border-box; }
        select, input { background: #334155; color: white; }
        button { background: #0ea5e9; color: white; font-weight: bold; cursor: pointer; }
        button:active { background: #0284c7; }
        .hidden { display: none !important; }
        .danger-btn { background: #ef4444 !important; }
        .danger-btn:active { background: #dc2626 !important; }
        .player-row { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 8px 12px; margin-top: 5px; border-radius: 6px; font-size: 0.9rem; }
        .kick-btn { background: #ef4444; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; width: auto; margin-top: 0; }
        .role-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-weight: bold; background: #38bdf8; color: #0f172a; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>Mobil Feign</h1>

    <div id="lobbyScreen" class="card">
        <h3>Oda İşlemleri</h3>
        <input type="text" id="playerNameInput" placeholder="Adın (Örn: Ahmet)..." maxlength="15">
        
        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
        
        <h4>Yeni Oda Kur (Lider Ol)</h4>
        <input type="text" id="newRoomCodeInput" placeholder="Oda Kodu (Örn: ODA1)" maxlength="10">
        <button onclick="createRoom()" style="background: #10b981;">Oda Oluştur</button>

        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">

        <h4>Var Olan Odaya Katıl</h4>
        <input type="text" id="joinRoomCodeInput" placeholder="Katılacağın Oda Kodu..." maxlength="10">
        <button onclick="joinRoom()">Odaya Katıl</button>
    </div>

    <div id="gameScreen" class="hidden">
        <div class="card">
            <div>Oda: <span id="currentRoomTitle" style="color: #38bdf8; font-weight: bold;">-</span> | Durum: <span id="phase" style="font-weight: bold; color: #f59e0b;">Bekliyor</span></div>
            <div id="playerInfo" style="margin-top: 8px;">Rolün: <span id="myRole" class="role-badge">Henüz atanmadı</span></div>
            <div style="margin-top: 12px; font-weight: bold; color: #94a3b8;">Odadaki Oyuncular:</div>
            <div id="playersListContainer" style="margin-top: 5px;"></div>
        </div>

        <div class="card">
            <h3>Oyun Günlüğü</h3>
            <div id="log">Odaya hoş geldin!<br></div>
        </div>

        <!-- GECE AKSİYON PANELİ -->
        <div class="card" id="actionPanel">
            <h3>Gece Aksiyonu / Seçim</h3>
            <select id="targetSelect">
                <option value="">Hedef Seç...</option>
            </select>
            <button onclick="submitAction()">Aksiyonu Gönder</button>
        </div>

        <!-- GÜNDÜZ OYLAMA PANELİ -->
        <div class="card hidden" id="votePanel">
            <h3>Gündüz Oylaması (İdam)</h3>
            <select id="voteTargetSelect">
                <option value="BOŞ">Boş Oy At</option>
            </select>
            <button onclick="submitVote()" style="background: #f59e0b;">Oyu Ver</button>
        </div>

        <div id="leaderPanel" class="card hidden" style="border: 2px dashed #f59e0b;">
            <h3 style="color: #f59e0b; margin-top:0;">Lider Paneli</h3>
            <button onclick="startMatch()">Oyunu Başlat & Rolleri Dağıt</button>
            <button style="background: #10b981; margin-top: 5px;" onclick="resolveNight()">Geceyi Bitir & Sabahı Hesapla</button>
            <button style="background: #f59e0b; margin-top: 5px;" onclick="resolveVotes()">Oylamayı Bitir & İdamı Hesapla</button>
            <button class="danger-btn" style="margin-top: 5px;" onclick="leaveRoom()">Odayı Kapat / Çık</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sulphxhrguiahelilyww.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1bHBoeGhyZ3VpYWhlbGlseXd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzU5MDIsImV4cCI6MjEwMzMxMTkwMn0.2WlzJyrIjWv0keYumuZp1EeB8GFnUY68uWdvjHgFS4M';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myName = "";
        let currentRoom = "";
        let isLeader = false;
        let roomData = null;

        function logMessage(msg) {
            const log = document.getElementById('log');
            log.innerHTML += `> ${msg}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        async function createRoom() {
            myName = document.getElementById('playerNameInput').value.trim();
            currentRoom = document.getElementById('newRoomCodeInput').value.trim().toUpperCase();

            if(!myName || !currentRoom) {
                alert("Lütfen adını ve bir oda kodu yaz!");
                return;
            }

            let { data: existing } = await supabaseClient.from('rooms').select('*').eq('room_code', currentRoom).single();
            if(existing) {
                alert("Bu oda kodu zaten kullanımda!");
                return;
            }

            isLeader = true;
            let newPlayers = [{ name: myName, role: 'Lider', status: 'Yaşıyor', privateLogs: [], vote: null }];

            let { error } = await supabaseClient.from('rooms').insert([{
                room_code: currentRoom,
                room_phase: 'Bekliyor',
                players: newPlayers,
                actions: {},
                logs: [`Oda ${currentRoom} kuruldu. Lider: ${myName}`]
            }]);

            if(error) {
                alert("Oda kurulamadı: " + error.message);
                return;
            }

            enterGameScreen();
        }

        async function joinRoom() {
            myName = document.getElementById('playerNameInput').value.trim();
            currentRoom = document.getElementById('joinRoomCodeInput').value.trim().toUpperCase();

            if(!myName || !currentRoom) {
                alert("Lütfen adını ve oda kodunu yaz!");
                return;
            }

            let { data: room, error } = await supabaseClient.from('rooms').select('*').eq('room_code', currentRoom).single();
            if(error || !room) {
                alert("Böyle bir oda bulunamadı!");
                return;
            }

            if(room.room_phase !== 'Bekliyor') {
                alert("Bu oyun zaten başlamış!");
                return;
            }

            isLeader = false;
            let players = room.players || [];
            if(!players.find(p => p.name === myName)) {
                players.push({ name: myName, role: 'Atanmadı', status: 'Yaşıyor', privateLogs: [], vote: null });
                await supabaseClient.from('rooms').update({ players: players }).eq('room_code', currentRoom);
            }

            enterGameScreen();
        }

        function enterGameScreen() {
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('currentRoomTitle').innerText = currentRoom;

            if(isLeader) {
                document.getElementById('leaderPanel').classList.remove('hidden');
            } else {
                document.getElementById('leaderPanel').classList.add('hidden');
            }

            subRealtime();
            fetchRoomState();
        }

        async function fetchRoomState() {
            let { data } = await supabaseClient.from('rooms').select('*').eq('room_code', currentRoom).single();
            if(data) updateUI(data);
        }

        function subRealtime() {
            supabaseClient
                .channel('room_' + currentRoom)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `room_code=eq.${currentRoom}` }, payload => {
                    if(payload.eventType === 'DELETE') {
                        alert("Oda kapatıldı!");
                        location.reload();
                    } else if(payload.new) {
                        updateUI(payload.new);
                    }
                })
                .subscribe();
        }

        function updateUI(room) {
            roomData = room;

            let meStillHere = (room.players || []).find(p => p.name === myName);
            if(!meStillHere) {
                alert("Lider tarafından odadan atıldın!");
                location.reload();
                return;
            }

            document.getElementById('phase').innerText = room.room_phase;

            // Paneller Oyun Durumuna Göre Açılır/Kapanır
            if(room.room_phase === 'Oyun Bitti') {
                document.getElementById('actionPanel').classList.add('hidden');
                document.getElementById('votePanel').classList.add('hidden');
            } else if(room.room_phase.includes('Gece')) {
                document.getElementById('actionPanel').classList.remove('hidden');
                document.getElementById('votePanel').classList.add('hidden');
            } else if(room.room_phase.includes('Gündüz')) {
                document.getElementById('actionPanel').classList.add('hidden');
                document.getElementById('votePanel').classList.remove('hidden');
            } else {
                document.getElementById('actionPanel').classList.add('hidden');
                document.getElementById('votePanel').classList.add('hidden');
            }

            // Oyuncu Listesi
            const container = document.getElementById('playersListContainer');
            container.innerHTML = '';
            (room.players || []).forEach(p => {
                let row = document.createElement('div');
                row.className = 'player-row';
                row.innerHTML = `<span>${p.name} - <b style="color:${p.status === 'Ölü' ? '#ef4444' : '#10b981'}">${p.status || 'Yaşıyor'}</b></span>`;
                
                if(isLeader && p.name !== myName && room.room_phase === 'Bekliyor') {
                    let kickBtn = document.createElement('button');
                    kickBtn.className = 'kick-btn';
                    kickBtn.innerText = 'At';
                    kickBtn.onclick = () => kickPlayer(p.name);
                    row.appendChild(kickBtn);
                }
                container.appendChild(row);
            });

            // Kendi Rolüm
            const me = (room.players || []).find(p => p.name === myName);
            if(me && me.role) {
                document.getElementById('myRole').innerText = me.role;
            }

            // Logları Birleştirme (Genel + Bana Özel)
            let combinedLogs = [...(room.logs || [])];
            if(me && me.privateLogs) {
                combinedLogs = combinedLogs.concat(me.privateLogs);
            }

            const logDiv = document.getElementById('log');
            logDiv.innerHTML = combinedLogs.join('<br>') + '<br>';
            logDiv.scrollTop = logDiv.scrollHeight;

            // Hedef Seçim Listeleri
            const targetSelect = document.getElementById('targetSelect');
            targetSelect.innerHTML = '<option value="">Hedef Seç...</option><option value="HIÇBIR_ŞEY_YAPMA">Hiçbir Şey Yapma (Evde Kal)</option>';
            
            const voteTargetSelect = document.getElementById('voteTargetSelect');
            voteTargetSelect.innerHTML = '<option value="BOŞ">Boş Oy At</option>';

            (room.players || []).forEach(p => {
                if(p.status !== 'Ölü') {
                    if(p.name !== myName) {
                        let opt = document.createElement('option');
                        opt.value = p.name;
                        opt.innerText = p.name;
                        targetSelect.appendChild(opt);
                    }
                    let voteOpt = document.createElement('option');
                    voteOpt.value = p.name;
                    voteOpt.innerText = p.name;
                    voteTargetSelect.appendChild(voteOpt);
                }
            });
        }

        async function kickPlayer(targetName) {
            if(!isLeader) return;
            let updatedPlayers = roomData.players.filter(p => p.name !== targetName);
            let logs = [...(roomData.logs || []), `${targetName} odadan atıldı.`];
            await supabaseClient.from('rooms').update({ players: updatedPlayers, logs: logs }).eq('room_code', currentRoom);
        }

        async function startMatch() {
            if(!isLeader) return;
            let players = roomData.players || [];
            if(players.length === 0) return;

            let baseRoles = ["Doktor", "Katil", "Polis", "Gözcü", "İzci", "Dedektif", "Tuzakçı", "İspiyoncu", "Provokatör", "Deli"];
            let shuffledRoles = baseRoles.sort(() => 0.5 - Math.random());
            
            players.forEach((p, index) => {
                p.role = shuffledRoles[index % shuffledRoles.length];
                p.status = 'Yaşıyor';
                p.privateLogs = [];
                p.vote = null;
            });

            let logs = ["Oyun başladı! Roller dağıtıldı, gece vakti."];

            await supabaseClient.from('rooms').update({ 
                room_phase: 'Gece (Aksiyon Zamanı)', 
                players: players,
                actions: {},
                logs: logs
            }).eq('room_code', currentRoom);
        }

        async function submitAction() {
            const target = document.getElementById('targetSelect').value;
            if(!target) {
                alert("Lütfen bir hedef seç!");
                return;
            }
            let actions = roomData.actions || {};
            actions[myName] = target;

            let logs = [...(roomData.logs || []), `${myName} aksiyonunu kullandı.`];

            await supabaseClient.from('rooms').update({ actions: actions, logs: logs }).eq('room_code', currentRoom);
            alert("Aksiyonun gönderildi!");
        }

        // GECE MOTORU - TÜM ROLLER AKTİF
        async function resolveNight() {
            if(!isLeader) return;
            let players = roomData.players || [];
            let actions = roomData.actions || {};
            let nightLogs = [...(roomData.logs || []), "--- GECE SONUÇLANDI ---"];

            // HER TUR BAŞINDA ESKİ GİZLİ MESAJLARI TEMİZLE
            players.forEach(p => p.privateLogs = []);

            // Eylemleri toparla
            let roleActions = {};
            players.forEach(p => {
                if(p.status === 'Ölü') return;
                let target = actions[p.name];
                if(!target || target === 'HIÇBIR_ŞEY_YAPMA') return;
                roleActions[p.role] = { from: p.name, to: target };
            });

            // 1. POLİS (Roleblocker) Aşaması
            let blockedPlayers = [];
            if (roleActions['Polis']) {
                let blocked = roleActions['Polis'].to;
                blockedPlayers.push(blocked);
                
                let cop = players.find(p => p.name === roleActions['Polis'].from);
                cop.privateLogs.push(`<span style="color:#38bdf8">[Gizli] ${blocked} isimli oyuncunun evden çıkmasını engelledin.</span>`);
                
                let blockedVictim = players.find(p => p.name === blocked);
                if(blockedVictim) {
                    blockedVictim.privateLogs.push(`<span style="color:#f59e0b">[Gizli] Bu gece bir Polis tarafından engellendin! Hiçbir eylem yapamadın.</span>`);
                }
            }

            // Engellenenleri filtrele
            let finalActions = {};
            players.forEach(p => {
                if (p.status === 'Ölü') return;
                let target = actions[p.name];
                if (!target || target === 'HIÇBIR_ŞEY_YAPMA' || blockedPlayers.includes(p.name)) return;
                finalActions[p.name] = { role: p.role, to: target };
            });

            // 2. KATİL VE DOKTOR AŞAMASI
            let killerAction = Object.entries(finalActions).find(([n, d]) => d.role === 'Katil');
            let doctorAction = Object.entries(finalActions).find(([n, d]) => d.role === 'Doktor');

            if (killerAction) {
                let killerName = killerAction[0];
                let targetKilled = killerAction[1].to;
                let isProtected = (doctorAction && doctorAction[1].to === targetKilled);

                let killer = players.find(p => p.name === killerName);

                if (isProtected) {
                    let doc = players.find(p => p.name === doctorAction[0]);
                    doc.privateLogs.push(`<span style="color:#10b981">[Gizli] Katilin hedefi olan ${targetKilled}'i başarıyla korudun!</span>`);

                    let victim = players.find(p => p.name === targetKilled);
                    victim.privateLogs.push(`<span style="color:#10b981">[Gizli] Gece katil sana saldırdı ancak bir Doktor seni kurtardı!</span>`);

                    killer.privateLogs.push(`<span style="color:#ef4444">[Gizli] ${targetKilled}'e saldırdın ama bir Doktor onu korudu! Öldüremedin.</span>`);
                } else {
                    let victim = players.find(p => p.name === targetKilled);
                    victim.status = 'Ölü';
                    victim.privateLogs.push(`<span style="color:#ef4444">[Gizli] Gece Katil tarafından öldürüldün!</span>`);
                    
                    killer.privateLogs.push(`<span style="color:#10b981">[Gizli] ${targetKilled}'i başarıyla öldürdün.</span>`);
                    nightLogs.push(`Katil dehşet saçtı! Bir kişi hayatını kaybetti.`);
                }
            }

            // 3. BİLGİ ROLLERİ AŞAMASI (İzci, Gözcü, Dedektif, İspiyoncu)
            let scoutAction = Object.entries(finalActions).find(([n, d]) => d.role === 'İzci');
            if(scoutAction) {
                let scout = players.find(p => p.name === scoutAction[0]);
                let targetName = scoutAction[1].to;
                let targetDest = actions[targetName]; // İzlenen kişinin ham eylemi
                
                if(blockedPlayers.includes(targetName) || !targetDest || targetDest === 'HIÇBIR_ŞEY_YAPMA') {
                    scout.privateLogs.push(`<span style="color:#38bdf8">[Gizli] İzlediğin ${targetName}, bu gece evden hiç çıkmadı.</span>`);
                } else {
                    scout.privateLogs.push(`<span style="color:#38bdf8">[Gizli] İzlediğin ${targetName}, bu gece ${targetDest} isimli kişinin evine gitti.</span>`);
                }
            }

            let watcherAction = Object.entries(finalActions).find(([n, d]) => d.role === 'Gözcü');
            if(watcherAction) {
                let watcher = players.find(p => p.name === watcherAction[0]);
                let targetName = watcherAction[1].to;
                let visitors = [];
                Object.entries(finalActions).forEach(([n, d]) => { if(d.to === targetName && n !== targetName) visitors.push(n); });
                
                if(visitors.length > 0) {
                    watcher.privateLogs.push(`<span style="color:#38bdf8">[Gizli] Gözetlediğin ${targetName}'in evine bu gece ${visitors.length} kişi geldi.</span>`);
                } else {
                    watcher.privateLogs.push(`<span style="color:#38bdf8">[Gizli] Gözetlediğin ${targetName}'in evine bu gece kimse uğramadı.</span>`);
                }
            }

            let detAction = Object.entries(finalActions).find(([n, d]) => d.role === 'Dedektif');
            if(detAction) {
                let det = players.find(p => p.name === detAction[0]);
                let targetPlayer = players.find(p => p.name === detAction[1].to);
                let baseRoles = ["Doktor", "Katil", "Polis", "Gözcü", "İzci", "Dedektif", "Tuzakçı", "İspiyoncu", "Provokatör", "Deli"];
                let wrongRoles = baseRoles.filter(r => r !== targetPlayer.role);
                let randomWrong = wrongRoles[Math.floor(Math.random() * wrongRoles.length)];
                let possible = [targetPlayer.role, randomWrong].sort(() => Math.random() - 0.5);
                
                det.privateLogs.push(`<span style="color:#38bdf8">[Gizli] ${targetPlayer.name} adlı kişinin rolü şunlardan biri: ${possible[0]} veya ${possible[1]}.</span>`);
            }

            let snitchAction = Object.entries(finalActions).find(([n, d]) => d.role === 'İspiyoncu');
            if(snitchAction) {
                let snitch = players.find(p => p.name === snitchAction[0]);
                let targetPlayer = players.find(p => p.name === snitchAction[1].to);
                snitch.privateLogs.push(`<span style="color:#38bdf8">[Gizli] İspiyonladın! ${targetPlayer.name} oyuncusunun kesin rolü: ${targetPlayer.role}.</span>`);
            }

            nightLogs.push("Sabah oldu! Lider oylamayı başlatabilir.");

            await supabaseClient.from('rooms').update({ 
                room_phase: 'Gündüz (Oylama Vakti)', 
                players: players,
                actions: {},
                votes: {},
                logs: nightLogs
            }).eq('room_code', currentRoom);
        }

        async function submitVote() {
            const target = document.getElementById('voteTargetSelect').value;
            let players = roomData.players;
            let me = players.find(p => p.name === myName);
            if(me) me.vote = target;

            await supabaseClient.from('rooms').update({ players: players }).eq('room_code', currentRoom);
            alert("Oyun kaydedildi!");
        }

        async function resolveVotes() {
            if(!isLeader) return;
            let players = roomData.players || [];
            let voteCounts = {};

            // Oylama başında da eski gizli logları temizle ki ekran ferahlasın
            players.forEach(p => p.privateLogs = []);

            players.forEach(p => {
                if(p.vote && p.vote !== 'BOŞ') {
                    voteCounts[p.vote] = (voteCounts[p.vote] || 0) + 1;
                }
            });

            let livingCount = players.filter(p => p.status === 'Yaşıyor').length;
            let majorityNeeded = Math.floor(livingCount / 2) + 1;
            let executed = null;

            for (let [target, count] of Object.entries(voteCounts)) {
                if (count >= majorityNeeded) {
                    executed = target;
                    break;
                }
            }

            let dayLogs = [...(roomData.logs || []), "--- OYLAMA SONUCU ---"];
            let newPhase = 'Gece (Aksiyon Zamanı)';

            if (executed) {
                let victim = players.find(p => p.name === executed);
                if (victim) {
                    victim.status = 'Ölü';
                    dayLogs.push(`${executed} çoğunluğun oyuyla idam edildi! Rolü: ${victim.role}`);
                    
                    // OYUN BİTİŞ KONTROLÜ (KATİL ASILIRSA)
                    if(victim.role === 'Katil') {
                        dayLogs.push("<b style='color:#10b981; font-size:1.1rem;'>🎉 KATİL İDAM EDİLDİ! OYUN BİTTİ! MASUMLAR KAZANDI! 🎉</b>");
                        newPhase = 'Oyun Bitti';
                    }
                }
            } else {
                dayLogs.push("Yeterli çoğunluk sağlanamadığı için kimse idam edilmedi.");
            }

            players.forEach(p => p.vote = null); // Oyları sıfırla
            if(newPhase !== 'Oyun Bitti') dayLogs.push("Gece vakti tekrar başlıyor...");

            await supabaseClient.from('rooms').update({ 
                room_phase: newPhase, 
                players: players,
                logs: dayLogs
            }).eq('room_code', currentRoom);
        }

        async function leaveRoom() {
            if(isLeader) {
                if(confirm("Odayı kapatmak istiyor musun?")) {
                    await supabaseClient.from('rooms').delete().eq('room_code', currentRoom);
                    location.reload();
                }
            } else {
                location.reload();
            }
        }
    </script>

</body>
</html>
