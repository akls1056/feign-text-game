<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Feign - Lobi Sistemi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        h1 { font-size: 1.5rem; text-align: center; color: #38bdf8; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        #log { height: 180px; overflow-y: scroll; background: #090d16; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 10px; }
        select, button, input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; font-size: 1rem; box-sizing: border-box; }
        select, input { background: #334155; color: white; }
        button { background: #0ea5e9; color: white; font-weight: bold; cursor: pointer; }
        button:active { background: #0284c7; }
        .hidden { display: none !important; }
        .danger-btn { background: #ef4444 !important; }
        .danger-btn:active { background: #dc2626 !important; }
        .player-row { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 8px 12px; margin-top: 5px; border-radius: 6px; font-size: 0.9rem; }
        .kick-btn { background: #ef4444; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; width: auto; margin-top: 0; }
        .role-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-weight: bold; background: #38bdf8; color: #0f172a; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>Mobil Feign</h1>

    <div id="lobbyScreen" class="card">
        <h3>Oda İşlemleri</h3>
        <input type="text" id="playerNameInput" placeholder="Adın (Örn: Ahmet)..." maxlength="15">
        
        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
        
        <h4>Yeni Oda Kur (Lider Ol)</h4>
        <input type="text" id="newRoomCodeInput" placeholder="Oda Kodu Belirle (Örn: ODA1)" maxlength="10">
        <button onclick="createRoom()" style="background: #10b981;">Oda Oluştur</button>

        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">

        <h4>Var Olan Odaya Katıl</h4>
        <input type="text" id="joinRoomCodeInput" placeholder="Katılacağın Oda Kodu..." maxlength="10">
        <button onclick="joinRoom()">Odaya Katıl</button>
    </div>

    <div id="gameScreen" class="hidden">
        <div class="card">
            <div>Oda: <span id="currentRoomTitle" style="color: #38bdf8; font-weight: bold;">-</span> | Durum: <span id="phase" style="font-weight: bold; color: #f59e0b;">Bekliyor</span></div>
            <div id="playerInfo" style="margin-top: 8px;">Rolün: <span id="myRole" class="role-badge">Henüz atanmadı</span></div>
            <div style="margin-top: 12px; font-weight: bold; color: #94a3b8;">Odadaki Oyuncular:</div>
            <div id="playersListContainer" style="margin-top: 5px;"></div>
        </div>

        <div class="card">
            <h3>Oyun Günlüğü</h3>
            <div id="log">Odaya hoş geldin!<br></div>
        </div>

        <div class="card" id="actionPanel">
            <h3>Gece Aksiyonu / Seçim</h3>
            <select id="targetSelect">
                <option value="">Hedef Seç...</option>
            </select>
            <button onclick="submitAction()">Aksiyonu Gönder</button>
        </div>

        <div id="leaderPanel" class="card hidden" style="border: 2px dashed #f59e0b;">
            <h3 style="color: #f59e0b; margin-top:0;">Lider Paneli</h3>
            <button onclick="startMatch()">Oyunu Başlat & Rolleri Dağıt</button>
            <button style="background: #10b981; margin-top: 5px;" onclick="resolveNight()">Geceyi Bitir & Sabahı Hesapla</button>
            <button class="danger-btn" style="margin-top: 5px;" onclick="leaveRoom()">Odayı Kapat / Çık</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sulphxhrguiahelilyww.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1bHBoeGhyZ3VpYWhlbGlseXd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzU5MDIsImV4cCI6MjEwMzMxMTkwMn0.2WlzJyrIjWv0keYumuZp1EeB8GFnUY68uWdvjHgFS4M';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myName = "";
        let currentRoom = "";
        let isLeader = false;
        let roomData = null;

        function logMessage(msg) {
            const log = document.getElementById('log');
            log.innerHTML += `> ${msg}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        async function createRoom() {
            myName = document.getElementById('playerNameInput').value.trim();
            currentRoom = document.getElementById('newRoomCodeInput').value.trim().toUpperCase();

            if(!myName || !currentRoom) {
                alert("Lütfen adını ve bir oda kodu yaz!");
                return;
            }

            let { data: existing } = await supabaseClient.from('rooms').select('*').eq('room_code', currentRoom).single();
            if(existing) {
                alert("Bu oda kodu zaten kullanımda! Başka bir kod dene.");
                return;
            }

            isLeader = true;
            let newPlayers = [{ name: myName, role: 'Lider', status: 'Yaşıyor' }];

            let { error } = await supabaseClient.from('rooms').insert([{
                room_code: currentRoom,
                host_name: myName,
                room_phase: 'Bekliyor',
                players: newPlayers,
                actions: {},
                logs: [`Oda ${currentRoom} kuruldu. Lider: ${myName}`]
            }]);

            if(error) {
                alert("Oda kurulamadı: " + error.message);
                return;
            }

            enterGameScreen();
        }

        async function joinRoom() {
            myName = document.getElementById('playerNameInput').value.trim();
            currentRoom = document.getElementById('joinRoomCodeInput').value.trim().toUpperCase();

            if(!myName || !currentRoom) {
                alert("Lütfen adını ve katılmak istediğin oda kodunu yaz!");
                return;
            }

            let { data: room, error } = await supabaseClient.from('rooms').select('*').eq('room_code', currentRoom).single();
            if(error || !room) {
                alert("Böyle bir oda bulunamadı!");
                return;
            }

            if(room.room_phase !== 'Bekliyor') {
                alert("Bu oyun zaten başlamış!");
                return;
            }

            isLeader = false;
            let players = room.players || [];
            if(!players.find(p => p.name === myName)) {
                players.push({ name: myName, role: 'Atanmadı', status: 'Yaşıyor' });
                await supabaseClient.from('rooms').update({ players: players }).eq('room_code', currentRoom);
            }

            enterGameScreen();
        }

        function enterGameScreen() {
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('currentRoomTitle').innerText = currentRoom;

            if(isLeader) {
                document.getElementById('leaderPanel').classList.remove('hidden');
            } else {
                document.getElementById('leaderPanel').classList.add('hidden');
            }

            subRealtime();
            fetchRoomState();
        }

        async function fetchRoomState() {
            let { data } = await supabaseClient.from('rooms').select('*').eq('room_code', currentRoom).single();
            if(data) updateUI(data);
        }

        function subRealtime() {
            supabaseClient
                .channel('room_' + currentRoom)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `room_code=eq.${currentRoom}` }, payload => {
                    if(payload.eventType === 'DELETE') {
                        alert("Oda lider tarafından kapatıldı!");
                        location.reload();
                    } else if(payload.new) {
                        updateUI(payload.new);
                    }
                })
                .subscribe();
        }

        function updateUI(room) {
            roomData = room;

            let meStillHere = (room.players || []).find(p => p.name === myName);
            if(!meStillHere) {
                alert("Lider tarafından odadan atıldın!");
                location.reload();
                return;
            }

            document.getElementById('phase').innerText = room.room_phase;

            const container = document.getElementById('playersListContainer');
            container.innerHTML = '';
            (room.players || []).forEach(p => {
                let row = document.createElement('div');
                row.className = 'player-row';
                row.innerHTML = `<span>${p.name} (${p.role || 'Bekliyor'}) - <b>${p.status || 'Yaşıyor'}</b></span>`;
                
                if(isLeader && p.name !== myName && room.room_phase === 'Bekliyor') {
                    let kickBtn = document.createElement('button');
                    kickBtn.className = 'kick-btn';
                    kickBtn.innerText = 'At';
                    kickBtn.onclick = () => kickPlayer(p.name);
                    row.appendChild(kickBtn);
                }
                container.appendChild(row);
            });

            const me = (room.players || []).find(p => p.name === myName);
            if(me && me.role) {
                document.getElementById('myRole').innerText = me.role;
            }

            if(room.logs && room.logs.length > 0) {
                const logDiv = document.getElementById('log');
                logDiv.innerHTML = room.logs.join('<br>') + '<br>';
                logDiv.scrollTop = logDiv.scrollHeight;
            }

            const targetSelect = document.getElementById('targetSelect');
            targetSelect.innerHTML = '<option value="">Hedef Seç...</option>';
            (room.players || []).forEach(p => {
                if(p.name !== myName && p.status !== 'Ölü') {
                    let opt = document.createElement('option');
                    opt.value = p.name;
                    opt.innerText = p.name;
                    targetSelect.appendChild(opt);
                }
            });
        }

        async function kickPlayer(targetName) {
            if(!isLeader) return;
            let updatedPlayers = roomData.players.filter(p => p.name !== targetName);
            let logs = [...(roomData.logs || []), `${targetName} odadan atıldı.`];
            await supabaseClient.from('rooms').update({ players: updatedPlayers, logs: logs }).eq('room_code', currentRoom);
        }

        async function startMatch() {
            if(!isLeader) return;
            let players = roomData.players || [];
            if(players.length === 0) return;

            let baseRoles = ["Doktor", "Katil", "Polis", "Gözcü", "İzci", "Dedektif", "Tuzakçı", "İspiyoncu", "Provokatör", "Deli"];
            let shuffledRoles = baseRoles.sort(() => 0.5 - Math.random());
            
            players.forEach((p, index) => {
                p.role = shuffledRoles[index % shuffledRoles.length];
                p.status = 'Yaşıyor';
            });

            let logs = [...(roomData.logs || []), "Oyun başladı! Roller dağıtıldı, gece vakti."];

            await supabaseClient.from('rooms').update({ 
                room_phase: 'Gece (Aksiyon Zamanı)', 
                players: players,
                actions: {},
                logs: logs
            }).eq('room_code', currentRoom);
        }

        async function submitAction() {
            const target = document.getElementById('targetSelect').value;
            if(!target) {
                alert("Lütfen bir hedef seç!");
                return;
            }
            let actions = roomData.actions || {};
            actions[myName] = target;

            await supabaseClient.from('rooms').update({ actions: actions }).eq('room_code', currentRoom);
            logMessage(`Seçimin kaydedildi: ${target}`);
        }

        async function resolveNight() {
            if(!isLeader) return;
            let players = roomData.players || [];
            let actions = roomData.actions || {};
            let nightLogs = [...(roomData.logs || []), "--- GECE SONUÇLANDI ---"];

            let doctorTarget = null;
            let killerTarget = null;

            players.forEach(p => {
                let target = actions[p.name];
                if (!target) return;
                if (p.role === 'Doktor') doctorTarget = { from: p.name, to: target };
                if (p.role === 'Katil') killerTarget = { from: p.name, to: target };
            });

            if (killerTarget) {
                let targetKilled = killerTarget.to;
                if (doctorTarget && doctorTarget.to === targetKilled) {
                    nightLogs.push(`Doktor, katilin hedefi olan ${targetKilled}'i korudu!`);
                } else {
                    nightLogs.push(`Katil ${targetKilled}'i öldürdü!`);
                    let victim = players.find(p => p.name === targetKilled);
                    if (victim) victim.status = 'Ölü';
                }
            }

            nightLogs.push("Sabah oldu!");

            await supabaseClient.from('rooms').update({ 
                room_phase: 'Gündüz', 
                players: players,
                actions: {},
                logs: nightLogs
            }).eq('room_code', currentRoom);
        }

        async function leaveRoom() {
            if(isLeader) {
                if(confirm("Odayı tamamen kapatmak istiyor musun?")) {
                    await supabaseClient.from('rooms').delete().eq('room_code', currentRoom);
                    location.reload();
                }
            } else {
                location.reload();
            }
        }
    </script>

</body>
</html>
