<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Feign - Gece Motoru</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        h1 { font-size: 1.5rem; text-align: center; color: #38bdf8; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        #log { height: 200px; overflow-y: scroll; background: #090d16; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 10px; }
        select, button, input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; font-size: 1rem; box-sizing: border-box; }
        select, input { background: #334155; color: white; }
        button { background: #0ea5e9; color: white; font-weight: bold; cursor: pointer; }
        button:active { background: #0284c7; }
        .hidden { display: none !important; }
        .danger-btn { background: #ef4444 !important; }
        .danger-btn:active { background: #dc2626 !important; }
        .player-list { font-size: 0.9rem; color: #94a3b8; margin-top: 5px; }
        .role-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-weight: bold; background: #38bdf8; color: #0f172a; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>Mobil Feign</h1>

    <div id="loginScreen" class="card">
        <h3>Oyuna Katıl</h3>
        <input type="text" id="playerNameInput" placeholder="Adın (Örn: Ahmet)..." maxlength="15">
        <label style="font-size: 0.9rem; color: #94a3b8; display: block; margin-top: 10px;">Katılım Rolü:</label>
        <select id="roleSelect">
            <option value="player">Oyuncu</option>
            <option value="leader">Lider (Oda Yöneticisi)</option>
        </select>
        <button onclick="joinGame()" style="margin-top: 15px;">Odaya Gir</button>
    </div>

    <div id="gameScreen" class="hidden">
        <div class="card">
            <div>Oda Durumu: <span id="phase" style="font-weight: bold; color: #f59e0b;">Bekliyor</span></div>
            <div id="playerInfo" style="margin-top: 8px;">Rolün: <span id="myRole" class="role-badge">Henüz atanmadı</span></div>
            <div class="player-list" id="playerListText" style="margin-top: 10px;">Odadakiler: Yükleniyor...</div>
        </div>

        <div class="card">
            <h3>Oyun Günlüğü</h3>
            <div id="log">Sisteme bağlanıldı.<br></div>
        </div>

        <div class="card" id="actionPanel">
            <h3>Gece Aksiyonu / Seçim</h3>
            <select id="targetSelect">
                <option value="">Hedef Seç...</option>
            </select>
            <button onclick="submitAction()">Aksiyonu Gönder</button>
        </div>

        <div id="leaderPanel" class="card hidden" style="border: 2px dashed #f59e0b;">
            <h3 style="color: #f59e0b; margin-top:0;">Lider Paneli</h3>
            <button onclick="startMatch()">Oyunu Başlat & Rolleri Dağıt</button>
            <button style="background: #10b981; margin-top: 5px;" onclick="resolveNight()">Geceyi Bitir & Sabahı Hesapla</button>
            <button class="danger-btn" style="margin-top: 5px;" onclick="resetGame()">Oyunu Sıfırla</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sulphxhrguiahelilyww.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1bHBoeHJndWlhaGVsaWx5d3ciLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NzczNTkwMiwiZXhwIjoyMTAzMzExOTAyfQ.2WlzJyrIjWv0keYumuZp1EeB8GFnUY68uWdvjHgFS4M';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myName = "";
        let isLeader = false;
        let gameState = { players: [], room_phase: "Bekliyor", actions: {}, logs: [] };

        function logMessage(msg) {
            const log = document.getElementById('log');
            log.innerHTML += `> ${msg}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        async function joinGame() {
            const nameInput = document.getElementById('playerNameInput').value.trim();
            const roleInput = document.getElementById('roleSelect').value;

            if(!nameInput) {
                alert("Lütfen adını yaz!");
                return;
            }
            myName = nameInput;
            isLeader = (roleInput === 'leader');

            try {
                let { data, error } = await supabaseClient.from('game_state').select('*').eq('id', 1).single();
                if (error) throw error;

                let currentPlayers = data.players || [];
                if(!currentPlayers.find(p => p.name === myName)) {
                    currentPlayers.push({ name: myName, role: 'Atanmadı', status: 'Yaşıyor' });
                    await supabaseClient.from('game_state').update({ players: currentPlayers }).eq('id', 1);
                }

                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');

                if(isLeader) {
                    document.getElementById('leaderPanel').classList.remove('hidden');
                    logMessage(`${myName} odaya Lider olarak girdi.`);
                } else {
                    logMessage(`${myName} odaya Oyuncu olarak girdi.`);
                }

                subRealtime();
                fetchState();
            } catch (err) {
                alert("Bağlantı Hatası: " + err.message);
            }
        }

        async function fetchState() {
            let { data } = await supabaseClient.from('game_state').select('*').eq('id', 1).single();
            if(data) updateUI(data);
        }

        function subRealtime() {
            supabaseClient
                .channel('public:game_state')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_state' }, payload => {
                    updateUI(payload.new);
                })
                .subscribe();
        }

        function updateUI(state) {
            gameState = state;
            document.getElementById('phase').innerText = state.room_phase;

            const pList = (state.players || []).map(p => `${p.name} (${p.status || 'Yaşıyor'})`).join(', ');
            document.getElementById('playerListText').innerText = `Odadakiler: ${pList || 'Kimse yok'}`;

            const me = (state.players || []).find(p => p.name === myName);
            if(me && me.role) {
                document.getElementById('myRole').innerText = me.role;
            }

            if(state.logs && state.logs.length > 0) {
                const logDiv = document.getElementById('log');
                logDiv.innerHTML = state.logs.join('<br>') + '<br>';
                logDiv.scrollTop = logDiv.scrollHeight;
            }

            const targetSelect = document.getElementById('targetSelect');
            targetSelect.innerHTML = '<option value="">Hedef Seç...</option>';
            (state.players || []).forEach(p => {
                if(p.name !== myName && p.status !== 'Ölü') {
                    let opt = document.createElement('option');
                    opt.value = p.name;
                    opt.innerText = p.name;
                    targetSelect.appendChild(opt);
                }
            });
        }

        async function startMatch() {
            if(!isLeader) return;
            let players = gameState.players || [];
            if(players.length === 0) {
                alert("Odada hiç oyuncu yok!");
                return;
            }

            let baseRoles = ["Doktor", "Katil", "Polis", "Gözcü", "İzci", "Dedektif", "Tuzakçı", "İspiyoncu", "Provokatör", "Deli"];
            let shuffledRoles = baseRoles.sort(() => 0.5 - Math.random());
            
            players.forEach((p, index) => {
                p.role = shuffledRoles[index % shuffledRoles.length];
                p.status = 'Yaşıyor';
            });

            let initialLogs = ["Lider oyunu başlattı! Roller dağıtıldı. Gece vakti başladı."];

            await supabaseClient.from('game_state').update({ 
                room_phase: 'Gece (Aksiyon Zamanı)', 
                players: players,
                actions: {},
                logs: initialLogs
            }).eq('id', 1);
        }

        async function submitAction() {
            const target = document.getElementById('targetSelect').value;
            if(!target) {
                alert("Lütfen bir hedef seç!");
                return;
            }
            let actions = gameState.actions || {};
            actions[myName] = target;

            await supabaseClient.from('game_state').update({ actions: actions }).eq('id', 1);
            logMessage(`Seçimin kaydedildi: ${target}`);
        }

        async function resolveNight() {
            if(!isLeader) return;
            let players = gameState.players || [];
            let actions = gameState.actions || {};
            let nightLogs = [...(gameState.logs || []), "--- GECE SONUÇLANDI ---"];

            let doctorTarget = null;
            let killerTarget = null;
            let watcherTarget = null;
            let scoutTarget = null;
            let snitchTarget = null;

            players.forEach(p => {
                let target = actions[p.name];
                if (!target) return;
                if (p.role === 'Doktor') doctorTarget = { from: p.name, to: target };
                if (p.role === 'Katil') killerTarget = { from: p.name, to: target };
                if (p.role === 'Gözcü') watcherTarget = { from: p.name, to: target };
                if (p.role === 'İzci') scoutTarget = { from: p.name, to: target };
                if (p.role === 'İspiyoncu') snitchTarget = { from: p.name, to: target };
            });

            let targetKilled = null;
            if (killerTarget) {
                targetKilled = killerTarget.to;
                if (doctorTarget && doctorTarget.to === targetKilled) {
                    nightLogs.push(`Doktor (${doctorTarget.from}), katilin hedefi olan ${targetKilled}'i başarıyla korudu!`);
                    targetKilled = null;
                } else {
                    nightLogs.push(`Katil dehşet saçtı! ${targetKilled} gece saldırıya uğradı.`);
                    let victim = players.find(p => p.name === targetKilled);
                    if (victim) victim.status = 'Ölü';
                }
            }

            if (watcherTarget) {
                let visitors = [];
                if (killerTarget && killerTarget.to === watcherTarget.to) visitors.push("Katil");
                if (doctorTarget && doctorTarget.to === watcherTarget.to) visitors.push("Doktor");
                nightLogs.push(`[Gözcü Bilgisi] ${watcherTarget.from}, ${watcherTarget.to} isimli kişinin evine ${visitors.length} kişinin geldiğini gördü.`);
            }

            if (scoutTarget) {
                let destination = actions[scoutTarget.to] || "hiçbir yere gitmedi";
                nightLogs.push(`[İzci Bilgisi] ${scoutTarget.from}, ${scoutTarget.to}'in ${destination} adresine gittiğini öğrendi.`);
            }

            if (snitchTarget) {
                nightLogs.push(`[İspiyoncu Bilgisi] ${snitchTarget.from} sabah ${snitchTarget.to} kişinin rolünü öğrendi.`);
            }

            nightLogs.push("Sabah oldu, kasaba uyanıyor! Tartışma ve oylama başlayabilir.");

            await supabaseClient.from('game_state').update({ 
                room_phase: 'Gündüz (Tartışma & Oylama)', 
                players: players,
                actions: {},
                logs: nightLogs
            }).eq('id', 1);
        }

        async function resetGame() {
            if(!isLeader) return;
            if(confirm("Odayı sıfırlamak istiyor musun?")) {
                await supabaseClient.from('game_state').update({ room_phase: 'Bekliyor', players: [], actions: {}, logs: [] }).eq('id', 1);
                location.reload();
            }
        }
    </script>

</body>
</html>
