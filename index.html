<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Feign - Wiki Rules Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        h1 { font-size: 1.5rem; text-align: center; color: #38bdf8; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        #log { height: 220px; overflow-y: scroll; background: #090d16; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 10px; line-height: 1.4; }
        select, button, input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; font-size: 1rem; box-sizing: border-box; }
        select, input { background: #334155; color: white; }
        button { background: #0ea5e9; color: white; font-weight: bold; cursor: pointer; }
        button:active { background: #0284c7; }
        .hidden { display: none !important; }
        .danger-btn { background: #ef4444 !important; }
        .danger-btn:active { background: #dc2626 !important; }
        .player-row { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 8px 12px; margin-top: 5px; border-radius: 6px; font-size: 0.9rem; }
        .kick-btn { background: #ef4444; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; width: auto; margin-top: 0; }
        .role-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-weight: bold; background: #38bdf8; color: #0f172a; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>Mobil Feign</h1>

    <div id="lobbyScreen" class="card">
        <h3>Oda İşlemleri</h3>
        <input type="text" id="playerNameInput" placeholder="Adın (Örn: Ahmet)..." maxlength="15">
        
        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
        
        <h4>Yeni Oda Kur (Lider Ol)</h4>
        <input type="text" id="newRoomCodeInput" placeholder="Oda Kodu (Örn: ODA1)" maxlength="10">
        <button onclick="createRoom()" style="background: #10b981;">Oda Oluştur</button>

        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">

        <h4>Var Olan Odaya Katıl</h4>
        <input type="text" id="joinRoomCodeInput" placeholder="Katılacağın Oda Kodu..." maxlength="10">
        <button onclick="joinRoom()">Odaya Katıl</button>
    </div>

    <div id="gameScreen" class="hidden">
        <div class="card">
            <div>Oda: <span id="currentRoomTitle" style="color: #38bdf8; font-weight: bold;">-</span> | Durum: <span id="phase" style="font-weight: bold; color: #f59e0b;">Bekliyor</span></div>
            <div id="playerInfo" style="margin-top: 8px;">Takım ve Rolün: <span id="myRole" class="role-badge">Henüz atanmadı</span></div>
            <div style="margin-top: 12px; font-weight: bold; color: #94a3b8;">Odadaki Oyuncular:</div>
            <div id="playersListContainer" style="margin-top: 5px;"></div>
        </div>

        <div class="card">
            <h3>Oyun Günlüğü</h3>
            <div id="log">Odaya hoş geldin!<br></div>
        </div>

        <div class="card" id="actionPanel">
            <h3>Gece Aksiyonu</h3>
            <label style="font-size: 0.9rem; color: #94a3b8;">Hedef (Seçtiğin kişiye gidersin):</label>
            <select id="targetSelect">
                <option value="">Hedef Seç...</option>
            </select>

            <div id="katilActionContainer" class="hidden" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 10px;">
                <label style="font-size: 0.9rem; color: #ef4444; font-weight: bold;">Aksiyon Türü (Sadece Katil):</label>
                <select id="actionTypeSelect">
                    <option value="kill">🔪 Hedefi Öldür</option>
                    <option value="role">🎭 Kendi Rol Yeteneğini Kullan</option>
                </select>
            </div>

            <button onclick="submitAction()" style="margin-top: 15px;">Aksiyonu Gönder</button>
        </div>

        <div class="card hidden" id="votePanel">
            <h3>Gündüz Oylaması (İdam)</h3>
            <select id="voteTargetSelect">
                <option value="BOŞ">Boş Oy At</option>
            </select>
            <button onclick="submitVote()" style="background: #f59e0b;">Oyu Ver</button>
        </div>

        <div id="leaderPanel" class="card hidden" style="border: 2px dashed #f59e0b;">
            <h3 style="color: #f59e0b; margin-top:0;">Lider Paneli</h3>
            <button onclick="startMatch()">Oyunu Başlat & Rolleri Dağıt</button>
            <button style="background: #10b981; margin-top: 5px;" onclick="resolveNight()">Geceyi Bitir & Sabahı Hesapla</button>
            <button style="background: #f59e0b; margin-top: 5px;" onclick="resolveVotes()">Oylamayı Bitir & İdamı Hesapla</button>
            <button class="danger-btn" style="margin-top: 5px;" onclick="leaveRoom()">Odayı Kapat / Çık</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sulphxhrguiahelilyww.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1bHBoeGhyZ3VpYWhlbGlseXd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzU5MDIsImV4cCI6MjEwMzMxMTkwMn0.2WlzJyrIjWv0keYumuZp1EeB8GFnUY68uWdvjHgFS4M';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myName = "";
        let currentRoom = "";
        let isLeader = false;
        let roomData = null;

        async function createRoom() {
            myName = document.getElementById('playerNameInput').value.trim();
            currentRoom = document.getElementById('newRoomCodeInput').value.trim().toUpperCase();

            if(!myName || !currentRoom) return alert("Lütfen adını ve bir oda kodu yaz!");

            let { data: existing } = await supabaseClient.from('rooms').select('*').eq('room_code', currentRoom).single();
            if(existing) return alert("Bu oda kodu zaten kullanımda!");

            isLeader = true;
            let newPlayers = [{ name: myName, role: 'Lider', team: 'Lider', displayRole: 'Lider', status: 'Yaşıyor', privateLogs: [], vote: null }];

            let { error } = await supabaseClient.from('rooms').insert([{
                room_code: currentRoom,
                room_phase: 'Bekliyor',
                players: newPlayers,
                actions: {},
                logs: [`Oda ${currentRoom} kuruldu. Lider: ${myName}`]
            }]);

            if(error) return alert("Hata: " + error.message);
            enterGameScreen();
        }

        async function joinRoom() {
            myName = document.getElementById('playerNameInput').value.trim();
            currentRoom = document.getElementById('joinRoomCodeInput').value.trim().toUpperCase();

            if(!myName || !currentRoom) return alert("Lütfen adını ve oda kodunu yaz!");

            let { data: room, error } = await supabaseClient.from('rooms').select('*').eq('room_code', currentRoom).single();
            if(error || !room) return alert("Oda bulunamadı!");
            if(room.room_phase !== 'Bekliyor') return alert("Bu oyun zaten başlamış!");

            isLeader = false;
            let players = room.players || [];
            if(!players.find(p => p.name === myName)) {
                players.push({ name: myName, role: 'Atanmadı', team: 'Atanmadı', displayRole: 'Atanmadı', status: 'Yaşıyor', privateLogs: [], vote: null });
                await supabaseClient.from('rooms').update({ players: players }).eq('room_code', currentRoom);
            }
            enterGameScreen();
        }

        function enterGameScreen() {
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('currentRoomTitle').innerText = currentRoom;
            if(isLeader) document.getElementById('leaderPanel').classList.remove('hidden');
            else document.getElementById('leaderPanel').classList.add('hidden');
            subRealtime();
            fetchRoomState();
        }

        async function fetchRoomState() {
            let { data } = await supabaseClient.from('rooms').select('*').eq('room_code', currentRoom).single();
            if(data) updateUI(data);
        }

        function subRealtime() {
            supabaseClient.channel('room_' + currentRoom)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `room_code=eq.${currentRoom}` }, payload => {
                    if(payload.eventType === 'DELETE') { alert("Oda kapatıldı!"); location.reload(); }
                    else if(payload.new) updateUI(payload.new);
                }).subscribe();
        }

        function updateUI(room) {
            roomData = room;
            let me = (room.players || []).find(p => p.name === myName);
            if(!me) { alert("Odadan atıldın!"); location.reload(); return; }

            document.getElementById('phase').innerText = room.room_phase;

            if(room.room_phase === 'Oyun Bitti') {
                document.getElementById('actionPanel').classList.add('hidden');
                document.getElementById('votePanel').classList.add('hidden');
            } else if(room.room_phase.includes('Gece')) {
                document.getElementById('actionPanel').classList.remove('hidden');
                document.getElementById('votePanel').classList.add('hidden');
            } else if(room.room_phase.includes('Gündüz')) {
                document.getElementById('actionPanel').classList.add('hidden');
                document.getElementById('votePanel').classList.remove('hidden');
            } else {
                document.getElementById('actionPanel').classList.add('hidden');
                document.getElementById('votePanel').classList.add('hidden');
            }

            if(me.team === 'Katil' && room.room_phase.includes('Gece')) {
                document.getElementById('katilActionContainer').classList.remove('hidden');
            } else {
                document.getElementById('katilActionContainer').classList.add('hidden');
            }

            const container = document.getElementById('playersListContainer');
            container.innerHTML = '';
            (room.players || []).forEach(p => {
                let row = document.createElement('div');
                row.className = 'player-row';
                row.innerHTML = `<span>${p.name} - <b style="color:${p.status === 'Ölü' ? '#ef4444' : '#10b981'}">${p.status || 'Yaşıyor'}</b></span>`;
                if(isLeader && p.name !== myName && room.room_phase === 'Bekliyor') {
                    let kickBtn = document.createElement('button');
                    kickBtn.className = 'kick-btn'; kickBtn.innerText = 'At';
                    kickBtn.onclick = () => kickPlayer(p.name); row.appendChild(kickBtn);
                }
                container.appendChild(row);
            });

            if(me.displayRole) document.getElementById('myRole').innerText = me.displayRole;

            let combinedLogs = [...(room.logs || [])];
            if(me.privateLogs) combinedLogs = combinedLogs.concat(me.privateLogs);
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = combinedLogs.join('<br>') + '<br>';
            logDiv.scrollTop = logDiv.scrollHeight;

            const targetSelect = document.getElementById('targetSelect');
            targetSelect.innerHTML = '<option value="HIÇBIR_ŞEY_YAPMA">Hiçbir Şey Yapma (Evde Kal)</option>';
            
            const voteTargetSelect = document.getElementById('voteTargetSelect');
            voteTargetSelect.innerHTML = '<option value="BOŞ">Boş Oy At</option>';

            (room.players || []).forEach(p => {
                if(p.status !== 'Ölü' && p.name !== myName) {
                    let opt1 = document.createElement('option'); opt1.value = p.name; opt1.innerText = p.name;
                    targetSelect.appendChild(opt1);
                }
                if(p.status !== 'Ölü') {
                    let voteOpt = document.createElement('option'); voteOpt.value = p.name; voteOpt.innerText = p.name;
                    voteTargetSelect.appendChild(voteOpt);
                }
            });
        }

        async function kickPlayer(targetName) {
            if(!isLeader) return;
            let updatedPlayers = roomData.players.filter(p => p.name !== targetName);
            await supabaseClient.from('rooms').update({ players: updatedPlayers }).eq('room_code', currentRoom);
        }

        async function startMatch() {
            if(!isLeader) return;
            let players = roomData.players || [];
            if(players.length === 0) return;

            let shuffledPlayers = [...players].sort(() => 0.5 - Math.random());
            
            // Deli ve Provokatör yok!
            let katilRoles = ["Polis", "Gözcü", "İzci", "Dedektif", "Tuzakçı", "İspiyoncu"];
            let masumRoles = ["Doktor", "Polis", "Gözcü", "İzci", "Dedektif", "Tuzakçı", "İspiyoncu"];

            // 1 Kişiyi Kesin Katil Yap
            let katilPlayer = shuffledPlayers[0];
            katilPlayer.team = 'Katil';
            katilPlayer.role = katilRoles[Math.floor(Math.random() * katilRoles.length)];
            katilPlayer.displayRole = `Katil ${katilPlayer.role}`;
            katilPlayer.status = 'Yaşıyor'; katilPlayer.privateLogs = []; katilPlayer.vote = null;

            // Geri Kalanları Masum Yap
            for(let i = 1; i < shuffledPlayers.length; i++) {
                let p = shuffledPlayers[i];
                p.team = 'Masum';
                p.role = masumRoles[Math.floor(Math.random() * masumRoles.length)];
                p.displayRole = `Masum ${p.role}`;
                p.status = 'Yaşıyor'; p.privateLogs = []; p.vote = null;
            }

            await supabaseClient.from('rooms').update({ 
                room_phase: 'Gece (Aksiyon Zamanı)', 
                players: players, actions: {}, logs: ["Oyun başladı! Roller dağıtıldı, gece vakti."]
            }).eq('room_code', currentRoom);
        }

        async function submitAction() {
            const target = document.getElementById('targetSelect').value;
            const actionType = document.getElementById('actionTypeSelect').value;
            let me = roomData.players.find(p => p.name === myName);
            
            let actions = roomData.actions || {};
            // Katil değilse her türlü rolünü kullanır.
            let resolvedType = (me.team === 'Katil') ? actionType : 'role';
            actions[myName] = { target: target, type: resolvedType };

            let logs = [...(roomData.logs || []), `${myName} aksiyonunu kullandı.`];
            await supabaseClient.from('rooms').update({ actions: actions, logs: logs }).eq('room_code', currentRoom);
            alert("Aksiyonun gönderildi!");
        }

        async function resolveNight() {
            if(!isLeader) return;
            let players = roomData.players || [];
            let actions = roomData.actions || {};
            let nightLogs = [...(roomData.logs || []), "--- GECE SONUÇLANDI ---"];

            // Ekran temizliği
            players.forEach(p => p.privateLogs = []);

            let intendedVisits = {};
            players.forEach(p => {
                if(p.status === 'Ölü') return;
                let act = actions[p.name];
                if(!act || act.target === 'HIÇBIR_ŞEY_YAPMA') return;
                intendedVisits[p.name] = act;
            });

            let blockedPlayers = [];

            // 1. TUZAKÇI HESAPLAMASI (Sadece ilk gelen basar)
            let trappedHouses = {};
            players.forEach(p => {
                if(p.role === 'Tuzakçı' && intendedVisits[p.name]) {
                    trappedHouses[intendedVisits[p.name].target] = p.name;
                    p.privateLogs.push(`<span style="color:#38bdf8">[Gizli] ${intendedVisits[p.name].target} evine tuzak kurdun.</span>`);
                }
            });

            // Evlere gelenleri topla
            let visitorsToHouse = {};
            Object.keys(intendedVisits).forEach(visitorName => {
                let dest = intendedVisits[visitorName].target;
                if(!visitorsToHouse[dest]) visitorsToHouse[dest] = [];
                visitorsToHouse[dest].push(visitorName);
            });

            Object.keys(trappedHouses).forEach(house => {
                let trapperName = trappedHouses[house];
                let visitors = visitorsToHouse[house] || [];
                let validVisitors = visitors.filter(v => v !== trapperName); // Kendisi basmaz
                
                if(validVisitors.length > 0) {
                    // İlk gelen (rastgele) 1 kişi tuzağa basar
                    let trappedPerson = validVisitors[Math.floor(Math.random() * validVisitors.length)];
                    blockedPlayers.push(trappedPerson);
                    
                    let vPlayer = players.find(x => x.name === trappedPerson);
                    if(vPlayer) vPlayer.privateLogs.push(`<span style="color:#f59e0b">[Gizli] Tuzağa bastın ve görevini yapamadın. Evine geri döndün!</span>`);
                    
                    let tPlayer = players.find(x => x.name === trapperName);
                    if(tPlayer) tPlayer.privateLogs.push(`<span style="color:#10b981">[Gizli] Kurduğun tuzağa birisi bastı!</span>`);
                }
            });

            // 2. POLİS HESAPLAMASI
            players.forEach(p => {
                if(p.role === 'Polis' && intendedVisits[p.name] && !blockedPlayers.includes(p.name)) {
                    let dest = intendedVisits[p.name].target;
                    blockedPlayers.push(dest);
                    p.privateLogs.push(`<span style="color:#38bdf8">[Gizli] ${dest} oyuncusunu başarıyla engelledin.</span>`);
                    let victim = players.find(x => x.name === dest);
                    if(victim) victim.privateLogs.push(`<span style="color:#f59e0b">[Gizli] Bir Polis tarafından engellendin! Gece evden çıkamadın.</span>`);
                }
            });

            let isBlocked = (name) => blockedPlayers.includes(name);

            // 3. KATİL VE DOKTOR HESAPLAMASI (Güvenli Kontrol)
            let doctors = [];
            let killers = [];

            players.forEach(p => {
                if(isBlocked(p.name)) return;
                let act = intendedVisits[p.name];
                if(!act) return;

                if(p.role === 'Doktor') doctors.push({ from: p.name, to: act.target });
                if(p.team === 'Katil' && act.type === 'kill') killers.push({ from: p.name, to: act.target });
            });

            let protectedPlayers = doctors.map(d => d.to);

            // Doktorlara Korumayı Bildir
            doctors.forEach(doc => {
                let docPlayer = players.find(p => p.name === doc.from);
                let attacked = killers.find(k => k.to === doc.to);
                if(attacked && docPlayer) {
                    docPlayer.privateLogs.push(`<span style="color:#10b981">[Gizli] Katilin hedefi olan ${doc.to}'i başarıyla korudun!</span>`);
                }
            });

            // Katilin Saldırısını Bildir
            killers.forEach(killer => {
                let killerPlayer = players.find(p => p.name === killer.from);
                let victimPlayer = players.find(p => p.name === killer.to);
                
                if(victimPlayer) {
                    if(protectedPlayers.includes(killer.to)) {
                        if(killerPlayer) killerPlayer.privateLogs.push(`<span style="color:#ef4444">[Gizli] Hedefine saldırdın ancak bir Doktor onu korudu! Öldüremedin.</span>`);
                        victimPlayer.privateLogs.push(`<span style="color:#10b981">[Gizli] Gece Katil sana saldırdı ancak bir Doktor seni kurtardı!</span>`);
                    } else {
                        victimPlayer.status = 'Ölü';
                        victimPlayer.privateLogs.push(`<span style="color:#ef4444">[Gizli] Gece Katil tarafından öldürüldün!</span>`);
                        if(killerPlayer) killerPlayer.privateLogs.push(`<span style="color:#10b981">[Gizli] ${killer.to}'i başarıyla öldürdün.</span>`);
                        nightLogs.push(`Katil dehşet saçtı! Bir kişi hayatını kaybetti.`);
                    }
                }
            });

            // 4. BİLGİ ROLLERİ HESAPLAMASI
            players.forEach(p => {
                if(isBlocked(p.name)) return;
                let act = intendedVisits[p.name];
                if(!act || act.type === 'kill') return;

                let target = act.target;
                let tPlayer = players.find(x => x.name === target);
                if(!tPlayer) return;

                if(p.role === 'İzci') {
                    let tAct = intendedVisits[target];
                    if(!tAct || isBlocked(target)) {
                        p.privateLogs.push(`<span style="color:#38bdf8">[Gizli] İzlediğin ${target}, bu gece evden hiç çıkmadı.</span>`);
                    } else {
                        p.privateLogs.push(`<span style="color:#38bdf8">[Gizli] İzlediğin ${target}, bu gece ${tAct.target} isimli kişinin evine gitti.</span>`);
                    }
                }
                else if(p.role === 'Gözcü') {
                    let visitors = [];
                    Object.keys(intendedVisits).forEach(vName => {
                        if(intendedVisits[vName].target === target && vName !== target && !isBlocked(vName)) {
                            visitors.push(vName);
                        }
                    });
                    if(visitors.length > 0) {
                        p.privateLogs.push(`<span style="color:#38bdf8">[Gizli] ${target}'in evine bu gece ${visitors.length} kişi geldi: ${visitors.join(', ')}.</span>`);
                    } else {
                        p.privateLogs.push(`<span style="color:#38bdf8">[Gizli] ${target}'in evine bu gece kimse uğramadı.</span>`);
                    }
                }
                else if(p.role === 'Dedektif') {
                    let realStr = `${tPlayer.team} ${tPlayer.role}`;
                    let oppTeam = tPlayer.team === 'Masum' ? 'Katil' : 'Masum';
                    let pool = oppTeam === 'Katil' ? ["Polis", "Gözcü", "İzci", "Dedektif", "Tuzakçı", "İspiyoncu"] : ["Doktor", "Polis", "Gözcü", "İzci", "Dedektif", "Tuzakçı", "İspiyoncu"];
                    let fakeRole = pool[Math.floor(Math.random() * pool.length)];
                    let arr = [realStr, `${oppTeam} ${fakeRole}`].sort(() => 0.5 - Math.random());
                    p.privateLogs.push(`<span style="color:#38bdf8">[Gizli] ${target} şu ikisinden biri: ${arr[0]} VEYA ${arr[1]}.</span>`);
                }
                else if(p.role === 'İspiyoncu') {
                    p.privateLogs.push(`<span style="color:#38bdf8">[Gizli] İspiyonladın! ${target}'in kesin rolü: ${tPlayer.team} ${tPlayer.role}.</span>`);
                }
            });

            nightLogs.push("Sabah oldu! Lider oylamayı başlatabilir.");

            await supabaseClient.from('rooms').update({ 
                room_phase: 'Gündüz (Oylama Vakti)', players: players, actions: {}, votes: {}, logs: nightLogs
            }).eq('room_code', currentRoom);
        }

        async function submitVote() {
            const target = document.getElementById('voteTargetSelect').value;
            let players = roomData.players;
            let me = players.find(p => p.name === myName);
            if(me) me.vote = target;
            await supabaseClient.from('rooms').update({ players: players }).eq('room_code', currentRoom);
            alert("Oyun kaydedildi!");
        }

        async function resolveVotes() {
            if(!isLeader) return;
            let players = roomData.players || [];
            let voteCounts = {};

            players.forEach(p => p.privateLogs = []);

            players.forEach(p => {
                if(p.vote && p.vote !== 'BOŞ') voteCounts[p.vote] = (voteCounts[p.vote] || 0) + 1;
            });

            let livingCount = players.filter(p => p.status === 'Yaşıyor').length;
            let majorityNeeded = Math.floor(livingCount / 2) + 1;
            let executed = null;

            for (let [target, count] of Object.entries(voteCounts)) {
                if (count >= majorityNeeded) { executed = target; break; }
            }

            let dayLogs = [...(roomData.logs || []), "--- OYLAMA SONUCU ---"];
            let newPhase = 'Gece (Aksiyon Zamanı)';

            if (executed) {
                let victim = players.find(p => p.name === executed);
                if (victim) {
                    victim.status = 'Ölü';
                    dayLogs.push(`${executed} çoğunluğun oyuyla idam edildi! Rolü: ${victim.team} ${victim.role}`);
                    
                    if(victim.team === 'Katil') {
                        dayLogs.push("<b style='color:#10b981; font-size:1.1rem;'>🎉 KATİL İDAM EDİLDİ! OYUN BİTTİ! MASUMLAR KAZANDI! 🎉</b>");
                        newPhase = 'Oyun Bitti';
                    }
                }
            } else {
                dayLogs.push("Yeterli çoğunluk sağlanamadığı için kimse idam edilmedi.");
            }

            players.forEach(p => p.vote = null);
            if(newPhase !== 'Oyun Bitti') dayLogs.push("Gece vakti tekrar başlıyor...");

            await supabaseClient.from('rooms').update({ 
                room_phase: newPhase, players: players, logs: dayLogs
            }).eq('room_code', currentRoom);
        }

        async function leaveRoom() {
            if(isLeader) {
                if(confirm("Odayı kapatmak istiyor musun?")) {
                    await supabaseClient.from('rooms').delete().eq('room_code', currentRoom);
                    location.reload();
                }
            } else { location.reload(); }
        }
    </script>
</body>
</html>
