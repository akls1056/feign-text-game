<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Feign - Text Edition</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        h1 { font-size: 1.5rem; text-align: center; color: #38bdf8; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        #log { height: 200px; overflow-y: scroll; background: #090d16; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 10px; }
        select, button, input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; font-size: 1rem; }
        select, input { background: #334155; color: white; }
        button { background: #0ea5e9; color: white; font-weight: bold; cursor: pointer; }
        button:active { background: #0284c7; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; background: #334155; }
    </style>
</head>
<body>

    <h1>Mobil Feign</h1>
    
    <div class="card">
        <div>Oda Durumu: <span id="phase" class="status-badge">Bekliyor...</span></div>
        <div id="playerInfo" style="margin-top: 5px; font-weight: bold;">Rolün: Henüz atanmadı</div>
    </div>

    <div class="card">
        <h3>Oyun Günlüğü</h3>
        <div id="log">Sistem başlatıldı. Oyuncuların katılması bekleniyor...<br></div>
    </div>

    <div class="card" id="actionPanel">
        <h3>Gece Aksiyonu / Seçim</h3>
        <p style="font-size: 0.9rem; color: #94a3b8;">Hedefini seç ve aksiyonunu onayla.</p>
        <select id="targetSelect">
            <option value="">Hedef Seç...</option>
        </select>
        <button onclick="submitAction()">Aksiyonu Gönder</button>
    </div>

    <script>
        // Şimdilik arayüz iskeleti. Supabase/Realtime entegrasyonu ile 
        // buraya 7 kişinin anlık veri alışverişini bağlayacağız.
        function logMessage(msg) {
            const log = document.getElementById('log');
            log.innerHTML += `> ${msg}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        function submitAction() {
            const target = document.getElementById('targetSelect').value;
            if(!target) {
                alert("Lütfen bir hedef seçin!");
                return;
            }
            logMessage(`Aksiyon gönderildi: ${target}`);
        }
    </script>

</body>
</html>
